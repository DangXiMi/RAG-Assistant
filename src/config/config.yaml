ingestion:
  # OCR for images and scanned PDF pages (Tesseract via pytesseract).
  ocr:
    enabled: true
    language: "eng"          # Tesseract language code(s), e.g. "eng" or "eng+vie"
    dpi: 300                 # rasterization resolution for scanned PDF pages
    # A PDF page with fewer non-whitespace characters than this is treated as
    # scanned and sent to OCR.
    min_text_chars: 40
  # Tables are rendered as Markdown so row/column structure stays retrievable.
  tables:
    extract: true
  # Text normalisation between loading and chunking.
  cleaning:
    enabled: true
    fix_hyphenation: true      # rejoin words split across line breaks
    strip_page_numbers: true   # drop lines that are only a page number
    remove_furniture: true     # drop headers/footers repeated across pages

chunker:
  chunk_size: 512
  overlap: 50
  separator: ["\n\n", "\n", ". ", "? ", "! ", " ", ""]

embedding:
  model_name: "sentence-transformers/all-MiniLM-L6-v2"
  batch_size: 32
  device: "auto"  # auto, cpu, cuda

qdrant:
  host: "localhost" 
  port: 6333
  collection_name: "rag_documents"
  vector_size: 384  

retrieval:
  default_top_k: 5
  score_threshold: 0.0

sparse_retrieval:
  default_top_k: 5
  score_threshold: 0.0 
  
hybrid_retrieval:
  candidate_k: 10   
  final_k: 5       
  rrf_k: 60         

generation:
  model: "llama3.1:8b"
  temperature: 0.0  # deterministic
  max_tokens: 512

hyde:
  enabled: True
  model: "llama3.1:8b"
  prompt_template: |
    Write a short document that answers the following question. Include specific facts and figures.
    Question: {query}
    Hypothetical Document:
  temperature: 0.0

multi_query:
  enabled: True
  num_queries: 3
  candidate_k: 10   
  temperature: 0.0
  rrf_k: 60
  prompt_template: |
    System: You are an AI assistant. Generate {num_queries} different variations of the user's question to help retrieve relevant documents. Each variation should be a single sentence, rephrased or expanded, but keeping the same meaning. Return only the variations, one per line, without numbering. 
    Original question: {query}
    Variations:         

reranking:
  enabled: True
  model_name: "cross-encoder/ms-marco-MiniLM-L-6-v2"
  candidate_k: 50   # Fetch this many from base retriever
  final_k: 5        # Return this many after reranking
  batch_size: 32

evaluation:
  # Judge LLM used by RAGAS. It must be an Ollama model that is actually
  # installed: `ollama list`. Must differ from the generator model to avoid
  # a model grading its own answers, but ideally no larger, since the judge
  # runs many times per question per metric.
  judge_model: "llama3.1:8b"
  judge_temperature: 0.0
  timeout: 300
  max_workers: 1
  embedding_model: "sentence-transformers/all-MiniLM-L6-v2"
  golden_file: "data/evaluation/golden.jsonl"

redis:
  host: "localhost"
  port: 6379
  db: 0

dedup:
  enabled: true
  redis_ttl: 2592000
