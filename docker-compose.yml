
services:
  # ─── Backing Services ─────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:latest
    container_name: rag_qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - rag_network
    restart: unless-stopped

  postgres:
    image: postgres:15
    container_name: rag_postgres
    environment:
      POSTGRES_USER: raglab
      POSTGRES_PASSWORD: raglab
      POSTGRES_DB: rag_metadata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - rag_network
    restart: unless-stopped

  redis:
    image: redis:7
    container_name: rag_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - rag_network
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: rag_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - rag_network
    restart: unless-stopped
  # ─── Backend API ──────────────────────────────────────────────────
  api:
    build:
      context: ./
      dockerfile: infra/Dockerfile.api
    container_name: rag_api
    ports:
      - "8000:8000"
    depends_on:
      - qdrant
      - postgres
      - redis
      - ollama
    environment:
      - CUDA_VISIBLE_DEVICES=""
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=raglab
      - POSTGRES_PASSWORD=raglab
      - POSTGRES_DB=rag_metadata
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - OLLAMA_HOST=ollama
      - OLLAMA_PORT=11434
      - LANGSMITH_API_KEY=${LANGSMITH_API_KEY:-}
    volumes:
      - ./uploads:/app/uploads
      - ./config:/app/config
    networks:
      - rag_network
    restart: unless-stopped
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000

  # ─── Async Worker ──────────────────────────────────────────────────
  worker:
    build:
      context: ./
      dockerfile: infra/Dockerfile.worker
    container_name: rag_worker
    depends_on:
      - redis
      - qdrant
      - postgres
    environment:
      - CUDA_VISIBLE_DEVICES=""
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=raglab
      - POSTGRES_PASSWORD=raglab
      - POSTGRES_DB=rag_metadata
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - ./uploads:/app/uploads
      - ./config:/app/config
    networks:
      - rag_network
    restart: unless-stopped
    command: arq src.ingestion.worker.WorkerSettings

  # ─── Streamlit UI ──────────────────────────────────────────────────
  ui:
    build:
      context: .
      dockerfile: infra/Dockerfile.ui
    container_name: rag_ui
    ports:
      - "8501:8501"
    depends_on:
      - api
    environment:
      - BACKEND_URL=http://api:8000
    networks:
      - rag_network
    restart: unless-stopped

# ─── Volumes ──────────────────────────────────────────────────────────
volumes:
  qdrant_data:
  postgres_data:
  redis_data:
  ollama_data:

# ─── Networks ──────────────────────────────────────────────────────────
networks:
  rag_network:
    driver: bridge